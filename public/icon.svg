<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1c19" />
      <stop offset="100%" stop-color="#111110" />
    </linearGradient>

    <!-- Signal Coral gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b85" />
      <stop offset="100%" stop-color="#e04461" />
    </linearGradient>

    <!-- Parchment Gold gradient -->
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f2" />
      <stop offset="100%" stop-color="#d8d0c2" />
    </linearGradient>

    <!-- Center glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="124" height="124" rx="27" fill="url(#bgGrad)" stroke="#38342c" stroke-width="2" />

  <!-- Inner border ledger hairline -->
  <rect x="6" y="6" width="116" height="116" rx="23" fill="none" stroke="#25231e" stroke-width="1" />

  <!-- Outer Audit Aperture Arcs (Lens Rings) -->
  <!-- Top-Right Coral Arc -->
  <path d="M 64 18 A 46 46 0 0 1 110 64" fill="none" stroke="url(#coralGrad)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Bottom-Left Coral Arc -->
  <path d="M 64 110 A 46 46 0 0 1 18 64" fill="none" stroke="url(#coralGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Top-Left Parchment Arc -->
  <path d="M 23 45 A 46 46 0 0 1 53 19" fill="none" stroke="url(#parchmentGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" />
  <!-- Bottom-Right Parchment Arc -->
  <path d="M 105 83 A 46 46 0 0 1 75 109" fill="none" stroke="url(#parchmentGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Secondary Inner Precision Orbit -->
  <circle cx="64" cy="64" r="32" fill="none" stroke="#524d42" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.6" />

  <!-- Cardinal Crosshair Reticle Lines -->
  <line x1="64" y1="13" x2="64" y2="23" stroke="url(#coralGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="64" y1="105" x2="64" y2="115" stroke="url(#coralGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="13" y1="64" x2="23" y2="64" stroke="url(#coralGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="105" y1="64" x2="115" y2="64" stroke="url(#coralGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Diagonal Compass Accents -->
  <circle cx="94" cy="34" r="2.5" fill="#f2eee5" opacity="0.8" />
  <circle cx="34" cy="94" r="2.5" fill="#f2eee5" opacity="0.8" />

  <!-- Serif Monogram "I" (Fraunces Editorial Style) -->
  <g fill="url(#parchmentGrad)">
    <!-- Top Serif Bar -->
    <path d="M 48 34 C 52 34 56 36 57 40 L 71 40 C 72 36 76 34 80 34 L 80 37 C 76 37 73 39 72 43 L 72 49 C 70 48 67 47 64 47 C 61 47 58 48 56 49 L 56 43 C 55 39 52 37 48 37 Z" />
    
    <!-- Bottom Serif Bar -->
    <path d="M 48 94 C 52 94 55 92 56 88 L 56 79 C 58 80 61 81 64 81 C 67 81 70 80 72 79 L 72 88 C 73 92 76 94 80 94 L 80 91 C 76 91 72 89 71 85 L 57 85 C 56 89 52 91 48 91 Z" />
  </g>

  <!-- Center Audit Aperture Cutout & Lens Core -->
  <circle cx="64" cy="64" r="16" fill="#151513" stroke="#524d42" stroke-width="1.5" />

  <!-- Glowing Signal Coral Target Reticle -->
  <circle cx="64" cy="64" r="11" fill="none" stroke="url(#coralGrad)" stroke-width="1.5" />
  
  <!-- Crosshair Inner Ticks -->
  <line x1="64" y1="49" x2="64" y2="54" stroke="url(#coralGrad)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="64" y1="74" x2="64" y2="79" stroke="url(#coralGrad)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="49" y1="64" x2="54" y2="64" stroke="url(#coralGrad)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="74" y1="64" x2="79" y2="64" stroke="url(#coralGrad)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Glowing Core Signal Dot -->
  <circle cx="64" cy="64" r="4.5" fill="url(#coralGrad)" filter="url(#glow)" />
  <circle cx="64" cy="64" r="2" fill="#fff" opacity="0.9" />
</svg>
